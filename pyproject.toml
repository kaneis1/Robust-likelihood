[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robust-likelihood"
version = "0.1.0"
description = "Pilot comparison of elicited plausibility judgments on English MASSIVE alarm utterances."
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8"]
figures = ["matplotlib>=3.8"]
lm = ["torch>=2.3", "transformers>=4.47", "accelerate>=0.33"]

[project.scripts]
robust-likelihood = "robust_likelihood.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
