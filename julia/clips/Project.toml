name = "RobustLikelihoodClips"

# The Julia environment of docs/clips_small_lm_plan.md. The [deps] and [compat] pins are CLIPS.jl's own
# (external/CLIPS.jl/Project.toml at 6536a2a), less the three plotting packages the experiment scripts
# never load (CairoMakie, GLMakie, PDDLViz; GLMakie needs a display). InversePlanning comes from
# cosilab/InversePlanning.jl#release-0.0.1, as CLIPS.jl's README says; scripts/clips_setup.sh adds it.
# Kept here rather than instantiated in external/, which is never edited.

